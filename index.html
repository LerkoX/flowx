<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=doc/web/index.html">
    <title>FlowX - 灵活的流水线执行引擎</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .redirect-box {
            text-align: center;
            padding: 40px;
        }
        .redirect-box h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        .redirect-box p {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 24px;
        }
        .redirect-box a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }
        .redirect-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <h1>FlowX</h1>
        <p>正在跳转到文档站点...</p>
        <p>如果没有自动跳转，请<a href="doc/web/index.html">点击这里</a>。</p>
    </div>
</body>
</html>
